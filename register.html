<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account | AUTOVEX</title><link rel="stylesheet" href="css/style.css"></head><body class="auth-body"><a class="brand auth-brand" href="index.html"><span class="brand-mark">A</span>AUTOVEX<span class="brand-dot">.</span></a><main class="auth-card"><div class="eyebrow">JOIN THE COMMUNITY</div><h1>Create your<br><em>AUTOVEX ID.</em></h1><p class="muted">One account for your automotive journey.</p><button class="social-btn" data-provider="Google">Continue with Google</button><button class="social-btn" data-provider="Apple">Continue with Apple</button><div class="divider"><span>or register with email</span></div><form id="registerForm"><label>Full name<input required placeholder="Your full name"></label><label>Email address<input type="email" required placeholder="you@example.com"></label><label>Phone number<input type="tel" placeholder="+233 ..."></label><label>Password<input type="password" required minlength="8" placeholder="At least 8 characters"></label><label>Account type<select><option>Buyer</option><option>Seller</option><option>Dealer</option><option>Service provider</option></select></label><button class="btn full" type="submit">Create account ↗</button></form><p class="auth-switch">Already registered? <a href="login.html">Log in</a></p><p class="demo-note" id="authMessage">Google, Apple and SMS verification need provider credentials and server configuration.</p></main><script src="js/app.js"></script></body></html>
